<div class="container" style="margin-top: 2rem; margin-bottom: 2rem;">
  <h2 class="page-header">Dashboard</h2>
  <hr/>
  
  <div style="background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 2rem;">
    <h3 style="margin-bottom: 1.5rem; color: #241e09;">Welcome, <span id="user-name"></span>!</h3>
    <p style="font-size: 18px; color: #3b331a;">View and manage your bookings below.</p>
  </div>

  <div style="background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <h3 style="margin-bottom: 1.5rem; color: #241e09;">My Bookings</h3>
    
    <button type="button" class="btn btn-fill btn-large" style="margin-bottom: 1rem;" onclick="DashboardService.openCreateBookingModal()">
      Create New Booking
    </button>

    <table id="my-bookings-table" class="table" style="width:100%;">
      <thead>
        <tr>
          <th>ID</th>
          <th>Check In</th>
          <th>Check Out</th>
          <th>Guests</th>
          <th>Status</th>
          <th>Total Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="bookings-tbody"></tbody>
    </table>
  </div>
</div>

<div class="modal" id="createBookingModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4);">
  <div class="modal-dialog" style="background-color: #fefefe; margin: 5% auto; padding: 20px; border: 1px solid #888; width: 500px; border-radius: 8px;">
    <div class="modal-content">
      <form id="createBookingForm">
        <div class="modal-header" style="margin-bottom: 1rem;">
          <h4 class="modal-title" style="color: #241e09;">Create New Booking</h4>
        </div>
        <div class="modal-body">
          <input type="hidden" id="guest_id" name="guest_id">
          
          <div class="form-group" style="margin-bottom: 1rem;">
            <label for="check_in_date">Check In Date:</label>
            <input type="date" class="form-control" id="check_in_date" name="check_in_date" required>
          </div>
          
          <div class="form-group" style="margin-bottom: 1rem;">
            <label for="check_out_date">Check Out Date:</label>
            <input type="date" class="form-control" id="check_out_date" name="check_out_date" required>
          </div>
          
          <div class="form-group" style="margin-bottom: 1rem;">
            <label for="num_of_guests">Number of Guests:</label>
            <input type="number" class="form-control" id="num_of_guests" name="num_of_guests" min="1" value="1" required>
          </div>
          
          <div class="form-group" style="margin-bottom: 1rem;">
            <label for="num_of_children">Number of Children:</label>
            <input type="number" class="form-control" id="num_of_children" name="num_of_children" min="0" value="0">
          </div>
          
          <div class="form-group" style="margin-bottom: 1rem;">
            <label for="booking_type">Booking Type:</label>
            <select class="form-control" id="booking_type" name="type" required>
              <option value="standard">Standard</option>
              <option value="nonrefundable">Non-Refundable</option>
              <option value="corporate">Corporate</option>
            </select>
          </div>
        </div>
        <div class="modal-footer" style="margin-top: 1rem;">
          <button type="button" class="btn btn-ghost" onclick="DashboardService.closeModal()">Close</button>
          <button type="submit" class="btn btn-fill">Create Booking</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="viewBookingModal" class="modal" style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.6); overflow-y: auto;">
  <div style="background:#fff; margin:5% auto; padding:0; width:40%; border-radius:10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    
    <div style="background: #241e09; color: #d4af37; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;">
      <h3 style="margin: 0; font-size: 20px;">Booking Confirmation</h3>
      <span onclick="$('#viewBookingModal').hide()" style="cursor: pointer; font-size: 24px; font-weight: bold;">&times;</span>
    </div>

    <div id="bookingDetailsContent" style="padding: 25px; color: #333; line-height: 1.6;">
        </div>

    <div style="padding: 15px 20px; background: #f9f9f9; text-align: right; border-top: 1px solid #eee;">
      <button class="btn btn-fill" onclick="$('#viewBookingModal').hide()">Close Window</button>
    </div>
  </div>
</div>
